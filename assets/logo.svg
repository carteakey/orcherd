<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="24" y1="16" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="crook" x1="128" y1="48" x2="128" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="nodeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="nodeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="nodeC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Rounded squircle badge -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bg)" stroke="#1E293B" stroke-width="4"/>

  <!-- Subtle orchard canopy halo -->
  <circle cx="128" cy="108" r="74" fill="#10B981" fill-opacity="0.07"/>
  <circle cx="144" cy="86" r="46" fill="#F59E0B" fill-opacity="0.08"/>

  <!-- Git worktree branches -->
  <path d="M128 164C98 164 76 146 66 118" stroke="url(#crook)" stroke-width="11" stroke-linecap="round"/>
  <path d="M128 182C158 182 182 166 194 140" stroke="url(#crook)" stroke-width="11" stroke-linecap="round"/>
  <path d="M128 128C108 128 94 110 88 82" stroke="url(#crook)" stroke-width="10" stroke-linecap="round"/>

  <!-- Shepherd's crook main trunk (Supervisor spine) -->
  <path d="M128 210V94C128 71.9086 145.909 54 168 54C190.091 54 208 71.9086 208 94C208 113.882 191.882 130 172 130H158"
        stroke="url(#crook)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Root platform -->
  <path d="M92 210H164" stroke="#34D399" stroke-width="12" stroke-linecap="round"/>

  <!-- Seat Node 1: Supervisor / Director (Amber Gold) -->
  <circle cx="168" cy="94" r="14" fill="url(#nodeA)"/>
  <circle cx="168" cy="94" r="6" fill="#0F172A"/>

  <!-- Seat Node 2: Builder A Worktree (Emerald) -->
  <circle cx="62" cy="108" r="18" fill="url(#nodeB)" stroke="#0F172A" stroke-width="4"/>
  <circle cx="62" cy="108" r="6" fill="#ECFDF5"/>

  <!-- Seat Node 3: Builder B Worktree (Sky Blue) -->
  <circle cx="198" cy="132" r="18" fill="url(#nodeC)" stroke="#0F172A" stroke-width="4"/>
  <circle cx="198" cy="132" r="6" fill="#F0F9FF"/>

  <!-- Seat Node 4: Blind Reviewer / Gauntlet (Amber-Emerald) -->
  <circle cx="86" cy="70" r="16" fill="url(#nodeA)" stroke="#0F172A" stroke-width="4"/>
  <circle cx="86" cy="70" r="5.5" fill="#FFFBEB"/>
</svg>
