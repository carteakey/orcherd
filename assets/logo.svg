<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>orcherd</title>
  <!-- A herd of terminal agents: a sheep whose head is a shell prompt. -->
  <rect width="256" height="256" rx="58" fill="#17142A"/>

  <!-- Legs -->
  <g stroke="#433A6B" stroke-width="16" stroke-linecap="round">
    <path d="M118 170v38"/>
    <path d="M182 168v38"/>
  </g>

  <!-- Wool: an ellipse under the curls so the outline has no gaps -->
  <g fill="#F5F1E8">
    <ellipse cx="150" cy="128" rx="66" ry="46"/>
    <circle cx="104" cy="104" r="28"/>
    <circle cx="140" cy="86" r="30"/>
    <circle cx="180" cy="94" r="28"/>
    <circle cx="206" cy="126" r="24"/>
    <circle cx="194" cy="160" r="24"/>
    <circle cx="154" cy="172" r="26"/>
    <circle cx="112" cy="162" r="26"/>
  </g>

  <!-- Head: a terminal with a prompt -->
  <ellipse cx="34" cy="98" rx="20" ry="11" transform="rotate(-32 34 98)" fill="#2C2548"/>
  <rect x="28" y="94" width="86" height="72" rx="22" fill="#2C2548"/>
  <path d="M48 116l15 13-15 13" stroke="#7CF0B0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 144h22" stroke="#7CF0B0" stroke-width="10" stroke-linecap="round"/>
</svg>
