[workspace]
members  = ["crates/orcherd-cli", "crates/orcherd-core", "crates/orcherd-hc"]
resolver = "2"

[workspace.package]
edition      = "2024"
license      = "Apache-2.0"
rust-version = "1.99"
version      = "0.1.0"
publish      = false

[workspace.lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
orcherd-core      = { path = "crates/orcherd-core" }
orcherd-hc        = { path = "crates/orcherd-hc" }
chrono            = { default-features = false, features = ["clock", "serde"], version = "0.4" }
crossbeam-channel = "0.5"
rusqlite          = { features = ["bundled"], version = "0.41" }
rustix            = { features = ["event", "fs", "process", "pty", "termios"], version = "=1.1.6" }
serde             = { features = ["derive"], version = "1" }
serde_json        = "1"
sha2              = "0.11.0"
tempfile          = "3"
thiserror         = "2"
toml              = "1.1"
tracing           = "0.1"
uuid              = { features = ["serde", "v4", "v5"], version = "1" }

[profile.dev]
debug = "line-tables-only"
